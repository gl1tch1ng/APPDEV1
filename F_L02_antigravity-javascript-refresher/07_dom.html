<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Battle HUD - DOM Interaction</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col items-center justify-center transition-colors duration-500 font-mono text-white p-4">

    <!-- Anime Battle HUD Card -->
    <div class="bg-slate-800 border-2 border-cyan-500/50 p-8 rounded-2xl shadow-2xl text-center max-w-md w-full backdrop-blur">
        <h1 class="text-3xl font-black text-cyan-400 tracking-wider uppercase mb-2">⚡ Battle HUD Scouter</h1>
        <p class="text-xs text-slate-400 mb-6 uppercase tracking-widest">Tactical Combat Interface</p>

        <!-- Button to trigger background color change via prompt -->
        <button id="themeBtn" class="w-full bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg shadow-red-500/30 transition transform hover:scale-105 active:scale-95 mb-6 uppercase tracking-wider">
            🔥 Shift Aura Color
        </button>

        <!-- Status Message Box modified dynamically by setTimeout -->
        <div class="p-4 bg-slate-950/80 border-l-4 border-cyan-500 rounded-lg text-left shadow-inner">
            <p id="statusMsg" class="text-cyan-300 font-semibold animate-pulse flex items-center gap-2">
                <span>⏳</span> <span>Calibrating combat scouter...</span>
            </p>
        </div>
    </div>

    <!-- DOM Interaction Script -->
    <script>
        // 1. Target the button and add a click event listener with prompt()
        const themeButton = document.getElementById("themeBtn");
        themeButton.addEventListener("click", () => {
            const auraColor = prompt("Enter an aura color (e.g. 'crimson', '#1e1b4b', 'darkred', 'gold'):");
            if (auraColor) {
                document.body.style.backgroundColor = auraColor;
            }
        });

        // 2. Asynchronous DOM update after 2000ms using setTimeout()
        const statusMessage = document.getElementById("statusMsg");
        setTimeout(() => {
            statusMessage.innerHTML = "<span>🔥</span> <span>Power Level: OVER 9000! Combat HUD Online.</span>";
            statusMessage.classList.remove("animate-pulse");
            statusMessage.classList.replace("text-cyan-300", "text-amber-400");
        }, 2000);
    </script>

</body>
</html>
